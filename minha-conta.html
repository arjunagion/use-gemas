<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta | Use Gemas</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="estilo/midias/favicon.png">
    <link rel="apple-touch-icon" href="estilo/midias/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="estilo/perfil.css?v=1.0">
</head>

<body>

    <!-- Header -->
    <header class="perfil-header">
        <div class="perfil-header-container">
            <a href="index.html" class="perfil-logo">USE GEMAS</a>
            <a href="index.html" class="perfil-back-link">← Voltar ao site</a>
        </div>
    </header>

    <!-- Tela de carregamento inicial -->
    <div id="perfil-loading" class="perfil-container">
        <div class="perfil-loading">
            <div class="spinner"></div>
            <p>Verificando acesso...</p>
        </div>
    </div>

    <!-- Conteúdo principal (só aparece depois de validar login) -->
    <main id="perfil-content" class="perfil-container" style="display: none;">

        <div class="perfil-hero">
            <h1>Olá, <span id="user-firstname">...</span> <span class="wave">👋</span></h1>
            <p id="user-email-hero">...</p>
        </div>

        <!-- Tabs -->
        <nav class="perfil-tabs" aria-label="Seções da conta">
            <button class="perfil-tab active" data-panel="pedidos" onclick="switchPanel('pedidos')">
                📦 Meus Pedidos
                <span class="count" id="tab-count-pedidos" style="display: none;">0</span>
            </button>
            <button class="perfil-tab" data-panel="dados" onclick="switchPanel('dados')">
                👤 Meus Dados
            </button>
            <button class="perfil-tab" data-panel="favoritos" onclick="switchPanel('favoritos')">
                ❤️ Favoritos
                <span class="count" id="tab-count-favoritos" style="display: none;">0</span>
            </button>
        </nav>

        <!-- ==================== PAINEL: PEDIDOS ==================== -->
        <section class="perfil-panel active" id="panel-pedidos">
            <div id="pedidos-container">
                <div class="perfil-loading">
                    <div class="spinner"></div>
                    <p>Carregando pedidos...</p>
                </div>
            </div>
        </section>

        <!-- ==================== PAINEL: DADOS ==================== -->
        <section class="perfil-panel" id="panel-dados">
            <div class="dados-card">
                <h2>Meus Dados</h2>
                <p class="subtitle">Você pode atualizar seu nome e telefone. O e-mail é a chave da sua conta e não pode ser alterado.</p>

                <form id="dados-form" onsubmit="handleDadosSubmit(event)" novalidate>
                    <div class="dados-grid">
                        <div class="dados-field">
                            <label for="dados-nome">Nome completo</label>
                            <input type="text" id="dados-nome" maxlength="100" required autocomplete="name">
                        </div>

                        <div class="dados-field">
                            <label for="dados-telefone">Telefone</label>
                            <input type="text" id="dados-telefone" maxlength="16" autocomplete="tel" placeholder="(11) 98765-4321">
                        </div>

                        <div class="dados-field full">
                            <label for="dados-email">E-mail</label>
                            <input type="email" id="dados-email" disabled>
                            <small class="hint">🔒 Este campo é bloqueado. Se precisar trocar, fale com a gente.</small>
                        </div>
                    </div>

                    <div class="dados-actions">
                        <div class="dados-feedback" id="dados-feedback"></div>
                        <button type="submit" class="btn-cream" id="dados-submit">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- ==================== PAINEL: FAVORITOS ==================== -->
        <section class="perfil-panel" id="panel-favoritos">
            <div id="favoritos-container">
                <div class="perfil-loading">
                    <div class="spinner"></div>
                    <p>Carregando favoritos...</p>
                </div>
            </div>
        </section>

    </main>

    <!-- Modal de Detalhes do Pedido -->
    <div id="pedido-modal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close" onclick="closePedidoModal()" aria-label="Fechar">&times;</button>
            <div id="pedido-modal-content"></div>
        </div>
    </div>

    <script>
        // ==========================================================================
        // Supabase
        // ==========================================================================
        const SUPABASE_URL = 'https://dytdnemwqbzgrekamwla.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5dGRuZW13cWJ6Z3Jla2Ftd2xhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3ODExMTEsImV4cCI6MjEwNTM1NzExMX0.6Zb3JK1CrpSrPqtigu9ZyEm_rWLKATOiQvPRQZmCU24';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==========================================================================
        // Estado Global
        // ==========================================================================
        let currentUser = null;
        let userProfile = null;
        let userOrders = [];
        let userFavorites = [];

        // ==========================================================================
        // Utilidades
        // ==========================================================================
        function formatBRL(value) {
            return Number(value).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function parseDateSafe(iso) {
            if (!iso) return null;
            let s = String(iso);
            if (!/[Zz]|[+-]\d{2}:?\d{2}$/.test(s)) {
                s = s + 'Z';
            }
            return new Date(s);
        }

        function formatDate(isoString) {
            const d = parseDateSafe(isoString);
            if (!d || isNaN(d.getTime())) return '';
            return d.toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' }) + ' às ' +
                d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Sao_Paulo' });
        }

        function formatDateShort(isoString) {
            const d = parseDateSafe(isoString);
            if (!d || isNaN(d.getTime())) return '';
            return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'America/Sao_Paulo' });
        }

        function escapeHTML(str) {
            if (!str && str !== 0) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getStatusLabel(status) {
            const map = {
                novo: 'Novo',
                pago: 'Pago',
                produzindo: 'Produzindo',
                enviado: 'Enviado',
                cancelado: 'Cancelado'
            };
            return map[status] || status;
        }

        function maskPhone(value) {
            const digits = value.replace(/\D/g, '').slice(0, 11);
            if (digits.length <= 10) {
                return digits.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{4})(\d{1,4})$/, '$1-$2');
            }
            return digits.replace(/(\d{2})(\d)/, '($1) $2').replace(/(\d{5})(\d{1,4})$/, '$1-$2');
        }

        // ==========================================================================
        // Troca de aba
        // ==========================================================================
        function switchPanel(panelName) {
            document.querySelectorAll('.perfil-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.panel === panelName);
            });
            document.querySelectorAll('.perfil-panel').forEach(p => {
                p.classList.toggle('active', p.id === 'panel-' + panelName);
            });
        }

        // ==========================================================================
        // Pedidos
        // ==========================================================================
        async function loadUserOrders() {
            const container = document.getElementById('pedidos-container');

            const { data, error } = await supabaseClient
                .from('orders')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Erro ao carregar pedidos:', error);
                container.innerHTML = `
                    <div class="perfil-empty">
                        <span class="icon">⚠️</span>
                        <h3>Não foi possível carregar</h3>
                        <p>Tenta recarregar a página em alguns instantes.</p>
                    </div>
                `;
                return;
            }

            userOrders = data || [];
            renderOrders();

            const countEl = document.getElementById('tab-count-pedidos');
            if (countEl) {
                countEl.innerText = userOrders.length;
                countEl.style.display = userOrders.length > 0 ? 'inline-block' : 'none';
            }
        }

        function renderOrders() {
            const container = document.getElementById('pedidos-container');

            if (userOrders.length === 0) {
                container.innerHTML = `
                    <div class="perfil-empty">
                        <span class="icon">🛍️</span>
                        <h3>Você ainda não fez pedidos</h3>
                        <p>Quando você fizer sua primeira compra, ela aparece aqui com todos os detalhes.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '<div class="pedidos-list">' +
                userOrders.map(o => {
                    const itemCount = (o.items || []).reduce((sum, i) => sum + Number(i.quantity), 0);
                    const statusLabel = getStatusLabel(o.status);

                    return `
                        <div class="pedido-card" onclick="openPedidoModal('${o.id}')">
                            <span class="pedido-status ${o.status}">${statusLabel}</span>
                            <div class="pedido-info">
                                <div class="pedido-numero">Pedido de ${formatDateShort(o.created_at)}</div>
                                <div class="pedido-meta">${itemCount} ${itemCount === 1 ? 'item' : 'itens'}</div>
                            </div>
                            <div class="pedido-total">${formatBRL(o.total)}</div>
                            <div class="pedido-arrow">→</div>
                        </div>
                    `;
                }).join('') +
                '</div>';
        }

        function openPedidoModal(orderId) {
            const o = userOrders.find(x => x.id === orderId);
            if (!o) return;

            const itemsHTML = (o.items || []).map(item => `
                <div class="modal-item">
                    <div class="modal-item-info">
                        <div class="modal-item-name">${escapeHTML(item.name)}</div>
                        <div class="modal-item-ref">REF: ${escapeHTML(item.ref)} · ${item.quantity}x ${formatBRL(item.price)}</div>
                    </div>
                    <div class="modal-item-price">${formatBRL(Number(item.price) * Number(item.quantity))}</div>
                </div>
            `).join('');

            const address = [
                o.street ? `${o.street}, ${o.number}${o.complement ? ' - ' + o.complement : ''}` : null,
                o.neighborhood,
                o.city ? `${o.city}/${o.state}` : null,
                o.cep ? `CEP: ${o.cep}` : null
            ].filter(Boolean).join('<br>');

            document.getElementById('pedido-modal-content').innerHTML = `
                <h2 class="modal-title">Pedido de ${formatDateShort(o.created_at)}</h2>
                <p class="modal-subtitle">
                    Status: <strong style="color:var(--cr-gold-hover);">${getStatusLabel(o.status)}</strong>
                </p>

                <div class="modal-section">
                    <h4>Itens</h4>
                    ${itemsHTML}
                </div>

                <div class="modal-section">
                    <h4>Totais</h4>
                    <div class="modal-totals">
                        <div class="row"><span>Subtotal:</span><span>${formatBRL(o.subtotal)}</span></div>
                        <div class="row"><span>Frete:</span><span>${Number(o.shipping_cost) === 0 ? 'GRÁTIS ✨' : formatBRL(o.shipping_cost)}</span></div>
                        <div class="row total"><span>Total:</span><span>${formatBRL(o.total)}</span></div>
                    </div>
                </div>

                ${address ? `
                    <div class="modal-section">
                        <h4>Endereço de entrega</h4>
                        <p class="modal-detail">${address}</p>
                    </div>
                ` : ''}

                ${o.notes ? `
                    <div class="modal-section">
                        <h4>Observações</h4>
                        <p class="modal-detail">${escapeHTML(o.notes)}</p>
                    </div>
                ` : ''}

                <div class="modal-section">
                    <h4>Feito em</h4>
                    <p class="modal-detail">${formatDate(o.created_at)}</p>
                </div>
            `;

            document.getElementById('pedido-modal').classList.add('open');
        }

        function closePedidoModal() {
            document.getElementById('pedido-modal').classList.remove('open');
        }

        // ==========================================================================
        // Dados
        // ==========================================================================
        async function loadUserProfile() {
            // Busca nome no profiles
            const { data: profileData } = await supabaseClient
                .from('profiles')
                .select('name')
                .eq('id', currentUser.id)
                .maybeSingle();

            userProfile = profileData || {};

            const fullName = userProfile.name || currentUser.email.split('@')[0];
            const firstName = fullName.split(' ')[0];

            document.getElementById('user-firstname').innerText = firstName;
            document.getElementById('user-email-hero').innerText = currentUser.email;

            // Preenche o form
            document.getElementById('dados-nome').value = fullName;
            document.getElementById('dados-email').value = currentUser.email;

            // Busca telefone no checkout_data
            const { data: checkoutData } = await supabaseClient
                .from('checkout_data')
                .select('phone')
                .eq('user_id', currentUser.id)
                .maybeSingle();

            if (checkoutData && checkoutData.phone) {
                document.getElementById('dados-telefone').value = checkoutData.phone;
            }
        }

        async function handleDadosSubmit(event) {
            event.preventDefault();

            const btn = document.getElementById('dados-submit');
            const feedback = document.getElementById('dados-feedback');
            const nome = document.getElementById('dados-nome').value.trim();
            const telefone = document.getElementById('dados-telefone').value.trim();

            feedback.className = 'dados-feedback';
            feedback.innerText = '';

            if (!nome || nome.length < 3) {
                feedback.className = 'dados-feedback error';
                feedback.innerText = 'Informe seu nome completo.';
                return;
            }

            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Salvando...';

            try {
                // 1. Atualiza nome no profiles
                const { error: profileError } = await supabaseClient
                    .from('profiles')
                    .update({ name: nome })
                    .eq('id', currentUser.id);

                if (profileError) {
                    console.error('Erro ao salvar perfil:', profileError);
                    feedback.className = 'dados-feedback error';
                    feedback.innerText = 'Erro ao salvar. Tente novamente.';
                    return;
                }

                // 2. Atualiza telefone no checkout_data (se já existir linha)
                const { data: existing } = await supabaseClient
                    .from('checkout_data')
                    .select('user_id')
                    .eq('user_id', currentUser.id)
                    .maybeSingle();

                if (existing) {
                    await supabaseClient
                        .from('checkout_data')
                        .update({ phone: telefone, updated_at: new Date().toISOString() })
                        .eq('user_id', currentUser.id);
                } else if (telefone) {
                    await supabaseClient
                        .from('checkout_data')
                        .insert({ user_id: currentUser.id, phone: telefone });
                }

                // 3. Atualiza cabeçalho
                const firstName = nome.split(' ')[0];
                document.getElementById('user-firstname').innerText = firstName;
                userProfile.name = nome;

                feedback.className = 'dados-feedback success';
                feedback.innerText = '✓ Dados atualizados com sucesso!';

                setTimeout(() => {
                    feedback.innerText = '';
                    feedback.className = 'dados-feedback';
                }, 4000);

            } catch (e) {
                console.error('Erro inesperado:', e);
                feedback.className = 'dados-feedback error';
                feedback.innerText = 'Erro inesperado. Tente novamente.';
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        // ==========================================================================
        // Favoritos
        // ==========================================================================
        async function loadUserFavorites() {
            const container = document.getElementById('favoritos-container');

            const { data, error } = await supabaseClient
                .from('favorites')
                .select('*')
                .eq('user_id', currentUser.id)
                .order('created_at', { ascending: true });

            if (error) {
                console.error('Erro ao carregar favoritos:', error);
                container.innerHTML = `
                    <div class="perfil-empty">
                        <span class="icon">⚠️</span>
                        <h3>Não foi possível carregar</h3>
                        <p>Tenta recarregar a página em alguns instantes.</p>
                    </div>
                `;
                return;
            }

            userFavorites = (data || []).map(f => ({
                id: f.id,
                name: f.product_name,
                ref: f.product_ref,
                price: parseFloat(f.product_price)
            }));

            renderFavorites();

            const countEl = document.getElementById('tab-count-favoritos');
            if (countEl) {
                countEl.innerText = userFavorites.length;
                countEl.style.display = userFavorites.length > 0 ? 'inline-block' : 'none';
            }
        }

        function renderFavorites() {
            const container = document.getElementById('favoritos-container');

            if (userFavorites.length === 0) {
                container.innerHTML = `
                    <div class="perfil-empty">
                        <span class="icon">💛</span>
                        <h3>Sua lista de favoritos está vazia</h3>
                        <p>Toque no ❤️ de qualquer peça no site para salvar aqui.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '<div class="favoritos-list">' +
                userFavorites.map((f, idx) => `
                    <div class="favorito-card">
                        <div class="favorito-info">
                            <div class="favorito-nome">${escapeHTML(f.name)}</div>
                            <div class="favorito-ref">REF: ${escapeHTML(f.ref)}</div>
                            <div class="favorito-preco">${formatBRL(f.price)}</div>
                        </div>
                        <div class="favorito-actions">
                            <button class="btn-fav-icon danger" onclick="removeFavorite(${idx})" title="Remover dos favoritos">✕</button>
                        </div>
                    </div>
                `).join('') +
                '</div>';
        }

        async function removeFavorite(index) {
            const fav = userFavorites[index];
            if (!fav) return;

            if (!confirm(`Remover "${fav.name}" dos favoritos?`)) return;

            const { error } = await supabaseClient
                .from('favorites')
                .delete()
                .eq('id', fav.id);

            if (error) {
                alert('Erro ao remover. Tente novamente.');
                return;
            }

            userFavorites.splice(index, 1);
            renderFavorites();

            const countEl = document.getElementById('tab-count-favoritos');
            if (countEl) {
                countEl.innerText = userFavorites.length;
                countEl.style.display = userFavorites.length > 0 ? 'inline-block' : 'none';
            }
        }

        // ==========================================================================
        // Inicialização
        // ==========================================================================
        document.addEventListener('DOMContentLoaded', async () => {
            // Mascara do telefone
            const telInput = document.getElementById('dados-telefone');
            if (telInput) {
                telInput.addEventListener('input', (e) => {
                    e.target.value = maskPhone(e.target.value);
                });
            }

            // Fecha modal com ESC
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closePedidoModal();
                }
            });

            // Fecha modal clicando fora
            const modal = document.getElementById('pedido-modal');
            if (modal) {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closePedidoModal();
                });
            }

            // Verifica login
            const { data: { user }, error } = await supabaseClient.auth.getUser();

            if (error || !user) {
                // Não logado → volta pra home
                window.location.href = 'index.html';
                return;
            }

            currentUser = user;

            // Mostra conteúdo
            document.getElementById('perfil-loading').style.display = 'none';
            document.getElementById('perfil-content').style.display = 'block';

            // Carrega dados em paralelo
            await Promise.all([
                loadUserProfile(),
                loadUserOrders(),
                loadUserFavorites()
            ]);
        });
    </script>

</body>

</html>
